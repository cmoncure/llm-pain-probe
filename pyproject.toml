[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-pain-probe"
version = "0.1.0"
description = "Residual-stream probing for Pain-axis style interpretability experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "safetensors>=0.4",
  "torch>=2.4",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.45",
  "accelerate>=1.0",
]
analysis = [
  "matplotlib>=3.9",
  "polars>=1.8",
  "pyarrow>=17",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_pain_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
